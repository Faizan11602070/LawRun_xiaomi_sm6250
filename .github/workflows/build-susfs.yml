name: Build LawRun Kernel with SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LawRun Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf imagemagick lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
          # Note: lib32ncurses5-dev → lib32ncurses-dev (or lib32ncurses6) on Ubuntu 24.04
          # libncurses5-dev and libncurses5 → libncurses-dev
          # lib32readline-dev may also be unavailable; if it fails, remove it or use lib32readline8

      - name: Clone KernelSU (non-GKI)
        run: |
          git clone https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          git checkout v0.9.5

      - name: Clone SUSFS Patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout kernel-4.14

      - name: Apply KernelSU Patches
        run: |
          cd $GITHUB_WORKSPACE
          # For non-GKI kernels, KernelSU integration is manual.
          # The script below is a starting point but may not fully work.
          # You will likely need to follow the official non-GKI guide:
          # https://kernelsu.org/guide/how-to-integrate-for-non-gki.html
          bash KernelSU/tools/init_kernelsu.sh $(pwd) || echo "KernelSU init script failed. Manual integration required."

      - name: Apply SUSFS Patches
        run: |
          cd $GITHUB_WORKSPACE
          # Copy files as per SUSFS instructions
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          # Apply patches. If they fail, the log will show which hunks failed.
          # You will then need to manually edit the kernel source to resolve conflicts.
          echo "Applying KernelSU SUSFS patch..."
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "KERNELSU SUSFS PATCH FAILED - SEE ABOVE FOR REJECTS"
          cd ..
          
          echo "Applying kernel SUSFS patch..."
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || echo "KERNEL SUSFS PATCH FAILED - SEE ABOVE FOR REJECTS"

      - name: Configure Kernel
        run: |
          # Enable necessary config options. Appending to defconfig is a blunt approach.
          # The proper way is to use menuconfig or edit the defconfig manually,
          # but for automation, we append.
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          # You may also need to enable specific SUSFS features like:
          # CONFIG_KSU_SUSFS_SUS_PATH=y
          # CONFIG_KSU_SUSFS_SUS_MOUNT=y
          # etc. Check KernelSU/kernel/Kconfig for options.

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # Use the toolchain that LawRun expects. Android kernels often use Clang.
          # This may need adjustment. For simplicity, we use the system cross-compiler.
          # If the build fails, check LawRun's documentation for the correct toolchain.
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 vendor/atoll-perf_defconfig
          make -j$(nproc --all) O=out ARCH=arm64

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../LawRun-SUSFS-miatoll.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-SUSFS-miatoll
          path: LawRun-SUSFS-miatoll.zip
