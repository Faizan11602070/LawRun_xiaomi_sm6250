name: Build LawRun Kernel with SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LawRun Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf imagemagick lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: Download and Extract Clang Toolchain
        run: |
          # Download a prebuilt Clang toolchain suitable for 4.14 kernels
          # This uses the popular "proton-clang" toolchain, which is known to work well with many Android kernels.
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O proton-clang.zip
          unzip -q proton-clang.zip
          # The extracted folder is named proton-clang-master
          mv proton-clang-master clang
          # Prepend the Clang bin directory to the PATH
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Clone KernelSU (non-GKI)
        run: |
          rm -rf KernelSU
          git clone https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          git checkout v0.9.5

      - name: Clone SUSFS Patches
        run: |
          rm -rf susfs4ksu
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          git checkout kernel-4.14

      - name: Apply KernelSU Patches
        run: |
          cd $GITHUB_WORKSPACE
          bash KernelSU/tools/init_kernelsu.sh $(pwd) || echo "KernelSU init script failed. Manual integration required."

      - name: Apply SUSFS Patches
        run: |
          cd $GITHUB_WORKSPACE
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "KERNELSU SUSFS PATCH FAILED"
          cd ..
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || echo "KERNEL SUSFS PATCH FAILED"

      - name: Configure Kernel (Non-Interactive)
        run: |
          # Enable necessary config options. Appending is a blunt approach but works for automation.
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig

          # IMPORTANT: Set the missing CPU mask values to prevent the interactive prompt.
          # These values are typical for an 8-core big.LITTLE configuration (4 LITTLE + 4 BIG).
          # Adjust if your specific SoC requires different values.
          echo "CONFIG_LITTLE_CPU_MASK=0xF" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          echo "CONFIG_BIG_CPU_MASK=0xF0" >> arch/arm64/configs/vendor/atoll-perf_defconfig

          # Run olddefconfig to resolve any remaining new symbols non-interactively.
          make O=out ARCH=arm64 vendor/atoll-perf_defconfig
          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # Use LLVM=1 to tell the kernel build system to use Clang/LLVM.
          # The PATH already contains the Clang we downloaded.
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../LawRun-SUSFS-miatoll.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-SUSFS-miatoll
          path: LawRun-SUSFS-miatoll.zip
