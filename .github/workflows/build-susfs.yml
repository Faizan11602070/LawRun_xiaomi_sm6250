name: Build LawRun Kernel with SUSFS

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LawRun Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
          pip3 install --user git+https://github.com/casey/just

      - name: Clone KernelSU (non-GKI)
        run: |
          git clone https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          # Use a stable tag for non-GKI kernels
          git checkout v0.9.5

      - name: Clone SUSFS Patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          # Use a stable release tag
          git checkout kernel-4.14

      - name: Apply KernelSU Patches
        run: |
          # Apply KernelSU integration patches to the kernel source
          cd $GITHUB_WORKSPACE
          # This step often requires manual intervention; we use a placeholder script
          # The KernelSU repo provides a script for non-GKI integration
          bash KernelSU/tools/init_kernelsu.sh $(pwd)
          # Note: This may fail. If it does, you may need to manually integrate KernelSU.
          # See: https://kernelsu.org/guide/how-to-integrate-for-non-gki.html

      - name: Apply SUSFS Patches
        run: |
          cd $GITHUB_WORKSPACE
          # Copy the SUSFS patch files into the kernel source
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          # Apply the patches
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "PATCH FAILED - CHECK LOGS"
          cd ..
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || echo "PATCH FAILED - CHECK LOGS"

      - name: Configure Kernel
        run: |
          # Enable necessary config options
          # You may need to edit the defconfig file to enable CONFIG_KSU and CONFIG_KSU_SUSFS
          # For simplicity, we append them (this may not work for all kernels)
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/atoll-perf_defconfig
          # You may need to enable other SUSFS features manually

      - name: Build Kernel
        run: |
          # Use the AnyKernel3 builder approach
          # This is a simplified build command; you may need to adjust for your specific toolchain
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 vendor/atoll-perf_defconfig
          make -j$(nproc --all) O=out ARCH=arm64

      - name: Package with AnyKernel3
        run: |
          # Clone AnyKernel3 for packaging
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          # Copy the compiled kernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # Create the zip
          cd AnyKernel3
          zip -r9 ../LawRun-SUSFS-miatoll.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-SUSFS-miatoll
          path: LawRun-SUSFS-miatoll.zip
